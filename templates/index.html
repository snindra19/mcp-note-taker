<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Note Taker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #f4f4f4; }
    h1 { margin: 0; padding: 12px 16px; font-size: 20px; color: #fff; background: #2f4858; }
    .layout { display: flex; height: calc(100vh - 47px); }
    .sidebar { width: 280px; flex-shrink: 0; padding: 12px; overflow-y: auto; background: #fff; border-right: 1px solid #ccc; }
    .editor { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px; min-width: 0; overflow-y: auto; }
    #template-select { display: block; width: 100%; margin-top: 8px; padding: 8px; font: inherit; }
    #note-list { list-style: none; margin: 12px 0 0; padding: 0; }
    #note-list button { width: 100%; padding: 8px; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; background: none; border: none; border-bottom: 1px solid #eee; cursor: pointer; }
    #note-list button:hover { background: #eef3f6; }
    #note-list button.selected { font-weight: bold; background: #dbe7ee; }
    label { font-size: 14px; font-weight: bold; }
    #template-label { margin-left: 8px; font-size: 13px; color: #555; }
    input, textarea { width: 100%; padding: 8px; font: inherit; border: 1px solid #aaa; border-radius: 4px; }
    .body-field { flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 180px; }
    textarea { flex: 1; resize: none; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .actions button, .enhance-row button, #new-button { padding: 8px 14px; font: inherit; cursor: pointer; }
    #status { font-size: 14px; }
    #status.error { color: #b00020; }
    .enhance-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .enhance-row input { flex: 1; width: auto; min-width: 140px; }
    .enhance-row input[type="date"] { flex: 0 0 auto; min-width: 0; }
    #suggestion-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    #suggestion-chips:empty { display: none; }
    .chip { display: inline-flex; max-width: 100%; font-size: 13px; background: #dbe7ee; border-radius: 12px; }
    .chip button { padding: 4px 8px; font: inherit; background: none; border: none; cursor: pointer; }
    .chip-label { overflow-wrap: anywhere; text-align: left; }
    .chip-dismiss { flex-shrink: 0; }
    .chip button:hover { text-decoration: underline; }
    #preview-box { padding: 10px; background: #fff; border: 1px solid #2f4858; border-radius: 4px; }
    #preview-box[hidden] { display: none; }
    #preview-heading { margin-bottom: 6px; font-size: 14px; font-weight: bold; overflow-wrap: anywhere; }
    #preview-text { max-height: 140px; margin-bottom: 8px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Smart Note Taker</h1>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-button" type="button">New</button>
      <select id="template-select" aria-label="New from template">
        <option value="">New from template...</option>
        {% for template in templates %}
        <option value="{{ template.name }}">{{ template.label }}</option>
        {% endfor %}
      </select>
      <ul id="note-list"></ul>
    </aside>
    <main class="editor">
      <div>
        <label for="note-title">Title</label>
        <span id="template-label"></span>
        <input id="note-title" type="text" maxlength="{{ max_title_length }}">
      </div>
      <div class="body-field">
        <label for="note-body">Body</label>
        <textarea id="note-body" maxlength="{{ max_body_length }}"></textarea>
      </div>
      <div id="suggestion-chips"></div>
      <div class="actions">
        <button id="save-button" type="button">Save</button>
        <button id="delete-button" type="button" disabled>Delete</button>
        <span id="status" role="status"></span>
      </div>
      <div class="enhance-row">
        <input id="weather-city" type="text" placeholder="City" aria-label="City for weather" maxlength="{{ max_city_length }}">
        <input id="weather-date" type="date" aria-label="Optional date for weather">
        <button id="weather-button" type="button">Add weather</button>
      </div>
      <div class="enhance-row">
        <input id="link-url" type="text" list="link-choices" placeholder="https://..." aria-label="Link to summarize">
        <datalist id="link-choices"></datalist>
        <button id="link-button" type="button">Summarize link</button>
      </div>
      <div id="preview-box" hidden>
        <div id="preview-heading"></div>
        <div id="preview-text"></div>
        <div class="actions">
          <button id="insert-button" type="button">Insert</button>
          <button id="discard-button" type="button">Discard</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const noteList = document.getElementById("note-list");
    const titleInput = document.getElementById("note-title");
    const bodyInput = document.getElementById("note-body");
    const deleteButton = document.getElementById("delete-button");
    const statusText = document.getElementById("status");
    const cityInput = document.getElementById("weather-city");
    const dateInput = document.getElementById("weather-date");
    const linkInput = document.getElementById("link-url");
    const linkChoices = document.getElementById("link-choices");
    const previewBox = document.getElementById("preview-box");
    const previewHeading = document.getElementById("preview-heading");
    const previewText = document.getElementById("preview-text");

    const templateSelect = document.getElementById("template-select");
    const templateLabel = document.getElementById("template-label");
    // The templates come from templates_config.py, through the server.
    const TEMPLATES = {{ templates|tojson }};
    const DEFAULT_TEMPLATE_NAME = {{ default_template|tojson }};
    const MAX_BODY_LENGTH = {{ max_body_length }};
    const ENHANCEMENTS_HEADING = "## Enhancements";
    const suggestionChips = document.getElementById("suggestion-chips");
    const SUGGESTION_DELAY_MS = 1500;
    const DISMISSED_STORAGE_KEY = "dismissedSuggestions";
    // Dismissed chips for a note that hasn't been saved yet are kept under this.
    const UNSAVED_NOTE_KEY = "unsaved";

    let suggestionTimer = null;
    // Raised by each suggestion request, so a late answer can be ignored.
    let suggestionRequestNumber = 0;
    let dismissedSuggestions = loadDismissedSuggestions();
    let previewResult = null;
    // Raised by each new request or note change, so a late answer can be ignored.
    let enhanceRequestNumber = 0;
    let notes = [];
    let selectedNoteId = null;
    let currentTemplateName = DEFAULT_TEMPLATE_NAME;
    let savedTitle = "";
    let savedBody = "";

    // Record what the editor holds now as the saved version.
    function rememberSavedEditorText() {
      savedTitle = titleInput.value;
      savedBody = bodyInput.value;
    }

    // Return true if there is nothing unsaved, or the user agrees to lose it.
    function canDiscardEdits() {
      const hasUnsavedEdits = titleInput.value !== savedTitle || bodyInput.value !== savedBody;
      if (!hasUnsavedEdits) {
        return true;
      }
      return window.confirm("Discard unsaved changes?");
    }

    // Show a success or error message next to the buttons.
    function showStatus(message, isError) {
      statusText.textContent = message;
      statusText.className = isError ? "error" : "";
    }

    // Call the API and return parsed JSON; throw an Error with a short message on failure.
    async function callApi(url, method, payload) {
      const options = { method: method };
      if (payload !== undefined) {
        options.headers = { "Content-Type": "application/json" };
        options.body = JSON.stringify(payload);
      }

      const response = await fetch(url, options);
      if (response.status === 204) {
        return null;
      }

      // A server failure may not return JSON, so parsing is allowed to fail.
      let data = null;
      try {
        data = await response.json();
      } catch (parseError) {
        data = null;
      }

      if (!response.ok) {
        const message = data && data.error ? data.error : "The request failed.";
        throw new Error(message);
      }
      return data;
    }

    // Draw the note list; textContent keeps note titles from being run as HTML.
    function renderNoteList() {
      noteList.textContent = "";

      // Add one button per note.
      for (const note of notes) {
        const listItem = document.createElement("li");
        const noteButton = document.createElement("button");
        noteButton.type = "button";
        noteButton.textContent = note.title;
        noteButton.title = note.title;
        if (note.id === selectedNoteId) {
          noteButton.className = "selected";
        }
        noteButton.addEventListener("click", function () {
          switchToNote(note);
        });
        listItem.appendChild(noteButton);
        noteList.appendChild(listItem);
      }
    }

    // Put a note in the editor, replacing whatever is there.
    function showNoteInEditor(note) {
      selectedNoteId = note.id;
      currentTemplateName = note.template;
      updateTemplateLabel();
      titleInput.value = note.title;
      bodyInput.value = note.body;
      rememberSavedEditorText();
      deleteButton.disabled = false;
      showStatus("", false);
      renderNoteList();
      requestSuggestions();
    }

    // Return the template with a given name.
    function findTemplate(templateName) {
      for (const template of TEMPLATES) {
        if (template.name === templateName) {
          return template;
        }
      }
      return null;
    }

    // Show the current note's template. An unknown name behaves like the default
    // template, so it is shown as that.
    function updateTemplateLabel() {
      const template = findTemplate(currentTemplateName) || findTemplate(DEFAULT_TEMPLATE_NAME);
      templateLabel.textContent = "Template: " + template.label;
    }

    // Reset the editor to a template's starting text, so the next Save creates a
    // new note. That text counts as saved, so leaving it untouched needs no prompt.
    function clearEditor(templateName = DEFAULT_TEMPLATE_NAME) {
      forgetDismissedSuggestions(UNSAVED_NOTE_KEY);
      selectedNoteId = null;
      currentTemplateName = templateName;
      updateTemplateLabel();
      titleInput.value = "";
      bodyInput.value = findTemplate(templateName).body;
      rememberSavedEditorText();
      deleteButton.disabled = true;
      showStatus("", false);
      renderNoteList();
      requestSuggestions();
      titleInput.focus();
    }

    // Handle a click on a note in the list.
    function switchToNote(note) {
      // Clicking the note already open would change nothing, so don't ask.
      if (note.id === selectedNoteId) {
        return;
      }
      if (canDiscardEdits()) {
        cancelEnhancement();
        showNoteInEditor(note);
      }
    }

    // Handle a click on the New button.
    function startNewNote() {
      if (canDiscardEdits()) {
        cancelEnhancement();
        clearEditor();
      }
    }

    // Handle a choice from the "New from template" dropdown.
    function startFromTemplate() {
      const templateName = templateSelect.value;

      // Go back to the prompt text, so the same template can be chosen again.
      templateSelect.value = "";
      if (canDiscardEdits()) {
        cancelEnhancement();
        clearEditor(templateName);
      }
    }

    // Load all notes from the server.
    async function loadNotes() {
      try {
        notes = await callApi("/api/notes", "GET");
        renderNoteList();
      } catch (error) {
        showStatus(error.message, true);
      }
    }

    // Create a new note or update the selected one.
    async function saveNote() {
      const payload = { title: titleInput.value, body: bodyInput.value };
      try {
        let savedNote;
        if (selectedNoteId === null) {
          payload.template = currentTemplateName;
          savedNote = await callApi("/api/notes", "POST", payload);
          moveUnsavedDismissals(savedNote.id);
        } else {
          savedNote = await callApi("/api/notes/" + selectedNoteId, "PUT", payload);
        }
        await loadNotes();
        showNoteInEditor(savedNote);
        showStatus("Saved.", false);
      } catch (error) {
        showStatus(error.message, true);
      }
    }

    // Delete the selected note after the user confirms.
    async function deleteNote() {
      if (selectedNoteId === null) {
        return;
      }
      if (!window.confirm("Delete this note?")) {
        return;
      }
      try {
        await callApi("/api/notes/" + selectedNoteId, "DELETE");
        forgetDismissedSuggestions(selectedNoteId);
        cancelEnhancement();
        clearEditor();
        await loadNotes();
        showStatus("Deleted.", false);
      } catch (error) {
        showStatus(error.message, true);
      }
    }

    // Hide the preview box and forget its result.
    function hidePreview() {
      previewResult = null;
      previewBox.hidden = true;
    }

    // Close the preview and ignore any answer still on its way, so a result
    // can't land in a different note from the one it was requested for.
    function cancelEnhancement() {
      enhanceRequestNumber += 1;
      hidePreview();
    }

    // Show an enhancement result; textContent keeps page text from being run as HTML.
    function showPreview(result) {
      previewResult = result;
      previewHeading.textContent = buildEnhancementHeading(result);
      previewText.textContent = result.text;
      previewBox.hidden = false;
    }

    // Ask the server for an enhancement and show the answer in the preview box.
    async function requestEnhancement(url, payload, waitingMessage) {
      cancelEnhancement();
      const thisRequestNumber = enhanceRequestNumber;
      showStatus(waitingMessage, false);

      try {
        const result = await callApi(url, "POST", payload);
        if (thisRequestNumber === enhanceRequestNumber) {
          showPreview(result);
          showStatus("Choose Insert or Discard.", false);
        }
      } catch (error) {
        if (thisRequestNumber === enhanceRequestNumber) {
          showStatus(error.message, true);
        }
      }
    }

    // Handle a click on Add weather.
    function addWeather() {
      const payload = { city: cityInput.value, date: dateInput.value };
      requestEnhancement("/api/enhance/weather", payload, "Getting weather...");
    }

    // Handle a click on Summarize link.
    function summarizeLink() {
      const payload = { url: linkInput.value };
      requestEnhancement("/api/enhance/link", payload, "Getting link...");
    }

    // Offer the links found in the note body as choices for the link box.
    function refreshLinkChoices() {
      const foundLinks = bodyInput.value.match(/https?:\/\/[^\s<>"]+/gi) || [];
      const uniqueLinks = new Set();

      // Remove punctuation that ends a sentence rather than the link.
      for (const foundLink of foundLinks) {
        uniqueLinks.add(foundLink.replace(/[.,;:!?)\]}']+$/, ""));
      }

      // Add one choice per link.
      linkChoices.textContent = "";
      for (const link of uniqueLinks) {
        const choice = document.createElement("option");
        choice.value = link;
        linkChoices.appendChild(choice);
      }
    }

    // Return the current local time as YYYY-MM-DD HH:MM.
    function formatCurrentTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      return now.getFullYear() + "-" + month + "-" + day + " " + hours + ":" + minutes;
    }

    // Return the heading line for a result, such as "Weather: Chicago".
    function buildEnhancementHeading(result) {
      const sourceName = result.source === "weather" ? "Weather" : "Link";
      return sourceName + ": " + result.label;
    }

    // Return the note body with a result added to its Enhancements section.
    function addToEnhancements(body, result) {
      let newBody = body.trimEnd();

      // Start the section if the note doesn't have one yet.
      if (!/^## Enhancements[ \t]*$/m.test(body)) {
        if (newBody !== "") {
          newBody += "\n\n";
        }
        newBody += ENHANCEMENTS_HEADING;
      }

      // The section is always last, so a new entry goes at the very end.
      newBody += "\n\n### " + buildEnhancementHeading(result);
      newBody += "\nSource: " + result.source + " | Added: " + formatCurrentTime();
      newBody += "\n\n" + result.text;
      return newBody;
    }

    // Add the previewed result to the note body when the user clicks Insert.
    function insertPreview() {
      if (previewResult === null) {
        return;
      }

      const newBody = addToEnhancements(bodyInput.value, previewResult);
      if (newBody.length > MAX_BODY_LENGTH) {
        showStatus("This would make the note longer than " + MAX_BODY_LENGTH + " characters.", true);
        return;
      }

      bodyInput.value = newBody;
      hidePreview();
      showStatus("Inserted. Click Save to keep it.", false);
      requestSuggestions();
    }

    // Throw away the previewed result when the user clicks Discard.
    function discardPreview() {
      hidePreview();
      showStatus("", false);
    }

    // Read dismissed chips from the browser; storage can be blocked or hold bad data.
    function loadDismissedSuggestions() {
      try {
        const storedValue = JSON.parse(localStorage.getItem(DISMISSED_STORAGE_KEY));
        if (storedValue !== null && typeof storedValue === "object" && !Array.isArray(storedValue)) {
          return storedValue;
        }
      } catch (storageError) {
        // Fall through and start with nothing dismissed.
      }
      return {};
    }

    // Write dismissed chips to the browser; if that fails they last until reload.
    function saveDismissedSuggestions() {
      try {
        localStorage.setItem(DISMISSED_STORAGE_KEY, JSON.stringify(dismissedSuggestions));
      } catch (storageError) {
        // Nothing else to do: dismissals still work for this page load.
      }
    }

    // Return the key that the current note's dismissed chips are kept under.
    function currentNoteKey() {
      return selectedNoteId === null ? UNSAVED_NOTE_KEY : selectedNoteId;
    }

    // Return the ids of the current note's dismissed chips.
    function currentDismissedIds() {
      const dismissedIds = dismissedSuggestions[currentNoteKey()];
      return Array.isArray(dismissedIds) ? dismissedIds : [];
    }

    // Forget the dismissed chips kept under a key.
    function forgetDismissedSuggestions(noteKey) {
      delete dismissedSuggestions[noteKey];
      saveDismissedSuggestions();
    }

    // Keep a new note's dismissed chips once it has been saved and has an id.
    function moveUnsavedDismissals(savedNoteId) {
      const unsavedIds = dismissedSuggestions[UNSAVED_NOTE_KEY];
      if (unsavedIds) {
        dismissedSuggestions[savedNoteId] = unsavedIds;
      }
      forgetDismissedSuggestions(UNSAVED_NOTE_KEY);
    }

    // Hide a chip for the current note, then ask again so another can take its place.
    function dismissSuggestion(suggestion) {
      const dismissedIds = currentDismissedIds();
      dismissedIds.push(suggestion.id);
      dismissedSuggestions[currentNoteKey()] = dismissedIds;
      saveDismissedSuggestions();
      requestSuggestions();
    }

    // Run a clicked chip's enhancement into the preview box.
    function runSuggestion(suggestion) {
      if (suggestion.type === "weather") {
        const payload = { city: suggestion.city, date: suggestion.date };
        requestEnhancement("/api/enhance/weather", payload, "Getting weather...");
      } else {
        requestEnhancement("/api/enhance/link", { url: suggestion.url }, "Getting link...");
      }
    }

    // Draw one chip; textContent keeps text from the note from being run as HTML.
    function createChip(suggestion) {
      const chip = document.createElement("span");
      chip.className = "chip";

      const runButton = document.createElement("button");
      runButton.type = "button";
      runButton.className = "chip-label";
      runButton.textContent = suggestion.label;
      if (suggestion.url) {
        runButton.title = suggestion.url;
      }
      runButton.addEventListener("click", function () {
        runSuggestion(suggestion);
      });

      const dismissButton = document.createElement("button");
      dismissButton.type = "button";
      dismissButton.className = "chip-dismiss";
      dismissButton.textContent = "×";
      dismissButton.setAttribute("aria-label", "Dismiss: " + suggestion.label);
      dismissButton.addEventListener("click", function () {
        dismissSuggestion(suggestion);
      });

      chip.appendChild(runButton);
      chip.appendChild(dismissButton);
      return chip;
    }

    // Replace the chips with a new list of suggestions.
    function renderSuggestions(suggestions) {
      suggestionChips.textContent = "";

      // Add one chip per suggestion.
      for (const suggestion of suggestions) {
        suggestionChips.appendChild(createChip(suggestion));
      }
    }

    // Ask the server for suggestions now. This only reads the text; no MCP server is called.
    async function requestSuggestions() {
      clearTimeout(suggestionTimer);
      suggestionRequestNumber += 1;
      const thisRequestNumber = suggestionRequestNumber;

      if (bodyInput.value.trim() === "") {
        renderSuggestions([]);
        return;
      }

      const payload = {
        text: bodyInput.value,
        dismissed: currentDismissedIds(),
        template: currentTemplateName,
      };
      try {
        const result = await callApi("/api/suggestions", "POST", payload);
        if (thisRequestNumber === suggestionRequestNumber) {
          renderSuggestions(result.suggestions);
        }
      } catch (error) {
        // Chips are optional, so a failure leaves the current ones and shows nothing.
      }
    }

    // Ask for suggestions once the user has stopped typing for 1.5 seconds.
    function scheduleSuggestions() {
      clearTimeout(suggestionTimer);
      suggestionTimer = setTimeout(requestSuggestions, SUGGESTION_DELAY_MS);
    }

    document.getElementById("new-button").addEventListener("click", startNewNote);
    templateSelect.addEventListener("change", startFromTemplate);
    document.getElementById("save-button").addEventListener("click", saveNote);
    deleteButton.addEventListener("click", deleteNote);
    document.getElementById("weather-button").addEventListener("click", addWeather);
    document.getElementById("link-button").addEventListener("click", summarizeLink);
    document.getElementById("insert-button").addEventListener("click", insertPreview);
    document.getElementById("discard-button").addEventListener("click", discardPreview);
    linkInput.addEventListener("focus", refreshLinkChoices);
    bodyInput.addEventListener("input", scheduleSuggestions);

    updateTemplateLabel();

    loadNotes();
  </script>
</body>
</html>
